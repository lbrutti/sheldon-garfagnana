<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MapLibre – Square Fill Pattern</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.6.0/maplibre-gl.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.6.0/maplibre-gl.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: #1a1a2e;
      color: #e8e0d0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 20px;
      background: #0f0f23;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 15px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #c8b89a;
      font-weight: normal;
    }

    #controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-left: auto;
      flex-wrap: wrap;
    }

    label {
      font-size: 12px;
      letter-spacing: 0.08em;
      color: #8a8aaa;
    }

    input[type="color"] {
      width: 32px;
      height: 22px;
      border: 1px solid #3a3a5a;
      border-radius: 3px;
      background: none;
      cursor: pointer;
      padding: 1px;
    }

    input[type="range"] {
      width: 80px;
      accent-color: #c8b89a;
    }

    #drop-zone {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(15,15,35,0.92);
      border: 2px dashed #4a4a6a;
      border-radius: 8px;
      padding: 18px 28px;
      text-align: center;
      font-size: 13px;
      color: #7a7a9a;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      backdrop-filter: blur(4px);
    }

    #drop-zone:hover, #drop-zone.drag-over {
      border-color: #c8b89a;
      color: #c8b89a;
    }

    #drop-zone.hidden { display: none; }

    #file-input { display: none; }

    #map {
      flex: 1;
      width: 100%;
    }

    #info {
      position: absolute;
      bottom: 20px;
      right: 16px;
      background: rgba(15,15,35,0.88);
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 11px;
      color: #7a7a9a;
      letter-spacing: 0.05em;
      backdrop-filter: blur(4px);
      max-width: 220px;
    }

    #info strong { color: #c8b89a; display: block; margin-bottom: 4px; }
  </style>
</head>
<body>

<header>
  <h1>Square Fill · MapLibre</h1>
  <div id="controls">
    <label>Square colour
      <input type="color" id="sq-color" value="#3a6ea5" />
    </label>
    <label>Size
      <input type="range" id="sq-size" min="4" max="24" value="8" />
      <span id="sq-size-val">8px</span>
    </label>
    <label>Gap
      <input type="range" id="sq-gap" min="1" max="16" value="4" />
      <span id="sq-gap-val">4px</span>
    </label>
    <label>Opacity
      <input type="range" id="sq-opacity" min="10" max="100" value="80" />
      <span id="sq-opacity-val">80%</span>
    </label>
  </div>
</header>

<div id="drop-zone" onclick="document.getElementById('file-input').click()">
  ⬇ Drop a GeoJSON file here, or click to browse
  <input type="file" id="file-input" accept=".geojson,.json" />
</div>

<div id="map"></div>

<div id="info">
  <strong>Square Fill Pattern</strong>
  Polygons are filled with a tiled grid of small squares — drawn via canvas and registered as a MapLibre pattern image.
</div>

<script>
  // ─── Map ──────────────────────────────────────────────────────────────────────
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        'osm': {
          type: 'raster',
          tiles: ['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'],
          tileSize: 256,
          attribution: '© OpenStreetMap contributors'
        }
      },
      layers: [{
        id: 'osm-tiles',
        type: 'raster',
        source: 'osm',
        paint: { 'raster-opacity': 0.35 }
      }]
    },
    center: [12.5, 41.9],
    zoom: 5
  });

  map.addControl(new maplibregl.NavigationControl(), 'top-right');

  // ─── Pattern generator ────────────────────────────────────────────────────────
  function makeSquarePattern({ squareSize = 8, gap = 4, color = '#3a6ea5', opacity = 0.8 } = {}) {
    const cell = squareSize + gap;
    const canvas = document.createElement('canvas');
    canvas.width  = cell;
    canvas.height = cell;
    const ctx = canvas.getContext('2d');

    ctx.clearRect(0, 0, cell, cell);

    // Parse hex to rgba
    const r = parseInt(color.slice(1, 3), 16);
    const g = parseInt(color.slice(3, 5), 16);
    const b = parseInt(color.slice(5, 7), 16);
    ctx.fillStyle = `rgba(${r},${g},${b},${opacity})`;

    // Draw one square, offset by gap/2 so it tiles symmetrically
    const off = Math.floor(gap / 2);
    ctx.fillRect(off, off, squareSize, squareSize);

    // Return raw Uint8Array as MapLibre expects: { width, height, data: Uint8ClampedArray }
    const imageData = ctx.getImageData(0, 0, cell, cell);
    return { width: cell, height: cell, data: new Uint8Array(imageData.data.buffer) };
  }

  // ─── State ────────────────────────────────────────────────────────────────────
  let currentGeoJSON = null;
  let patternParams = {
    squareSize: 8,
    gap: 4,
    color: '#3a6ea5',
    opacity: 0.8
  };

  const PATTERN_ID = 'square-fill-pattern';
  const SOURCE_ID  = 'geojson-source';

  function getParams() {
    return {
      squareSize: +document.getElementById('sq-size').value,
      gap:        +document.getElementById('sq-gap').value,
      color:      document.getElementById('sq-color').value,
      opacity:    +document.getElementById('sq-opacity').value / 100
    };
  }

  function rebuildPattern() {
    if (map.hasImage(PATTERN_ID)) map.removeImage(PATTERN_ID);
    const p = makeSquarePattern(getParams());
    map.addImage(PATTERN_ID, p, { pixelRatio: 1 });
  }

  function applyLayers() {
    if (!currentGeoJSON) return;

    // Source
    if (map.getSource(SOURCE_ID)) {
      map.getSource(SOURCE_ID).setData(currentGeoJSON);
    } else {
      map.addSource(SOURCE_ID, { type: 'geojson', data: currentGeoJSON });
    }

    // Fill outline
    if (!map.getLayer('poly-outline')) {
      map.addLayer({
        id: 'poly-outline',
        type: 'line',
        source: SOURCE_ID,
        filter: ['in', ['geometry-type'], ['literal', ['Polygon', 'MultiPolygon']]],
        paint: {
          'line-color': '#1a1a2e',
          'line-width': 1.2,
          'line-opacity': 0.9
        }
      });
    }

    // Pattern fill — remove & re-add so it picks up the new pattern image
    if (map.getLayer('poly-pattern')) map.removeLayer('poly-pattern');
    map.addLayer({
      id: 'poly-pattern',
      type: 'fill',
      source: SOURCE_ID,
      filter: ['in', ['geometry-type'], ['literal', ['Polygon', 'MultiPolygon']]],
      paint: {
        'fill-pattern': PATTERN_ID,
        'fill-opacity': 1
      }
    }, 'poly-outline'); // insert below outline

    // Fit bounds
    try {
      const coords = [];
      function collect(geom) {
        if (!geom) return;
        if (geom.type === 'Polygon') geom.coordinates[0].forEach(c => coords.push(c));
        else if (geom.type === 'MultiPolygon') geom.coordinates.forEach(p => p[0].forEach(c => coords.push(c)));
        else if (geom.type === 'GeometryCollection') geom.geometries.forEach(collect);
      }
      (currentGeoJSON.features || [currentGeoJSON]).forEach(f => collect(f.geometry || f));

      if (coords.length) {
        const lngs = coords.map(c => c[0]), lats = coords.map(c => c[1]);
        map.fitBounds(
          [[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]],
          { padding: 40, duration: 800 }
        );
      }
    } catch(e) { /* ignore */ }
  }

  // ─── Map ready ────────────────────────────────────────────────────────────────
  map.on('load', () => {
    rebuildPattern();

    // Load a demo polygon if no file provided (Italy outline as a placeholder hint)
    // — we won't auto-load anything; just wait for user file.
  });

  // ─── Controls ────────────────────────────────────────────────────────────────
  function updateLabel(id, suffix) {
    document.getElementById(id + '-val').textContent =
      document.getElementById(id).value + suffix;
  }

  ['sq-size', 'sq-gap', 'sq-opacity'].forEach(id => {
    const suffix = id === 'sq-opacity' ? '%' : 'px';
    document.getElementById(id).addEventListener('input', () => {
      updateLabel(id, suffix);
      if (map.loaded()) { rebuildPattern(); if (currentGeoJSON) applyLayers(); }
    });
  });

  document.getElementById('sq-color').addEventListener('input', () => {
    if (map.loaded()) { rebuildPattern(); if (currentGeoJSON) applyLayers(); }
  });

  // ─── File handling ────────────────────────────────────────────────────────────
  function loadGeoJSON(text) {
    try {
      currentGeoJSON = JSON.parse(text);
      document.getElementById('drop-zone').classList.add('hidden');
      rebuildPattern();
      applyLayers();
    } catch(e) {
      alert('Could not parse GeoJSON: ' + e.message);
    }
  }

  document.getElementById('file-input').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => loadGeoJSON(ev.target.result);
    reader.readAsText(file);
  });

  const dz = document.getElementById('drop-zone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave',  () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => loadGeoJSON(ev.target.result);
    reader.readAsText(file);
  });
</script>
</body>
</html>
