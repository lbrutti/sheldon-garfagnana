<div class="map-controls">
  <div class="filter-container">

    <ng-content select="[mapControls]"/>

<!--    <sheldon-dynamic-filter-->
<!--      class="big-field"-->
<!--      [filterBy]="['comune']"-->
<!--      [dataset]="comuniDataset()"-->
<!--      (filterChange)="onFilterChange($event)"/>-->

  </div>
</div>
<!-- Map wrapper -->
<div class="map-wrapper">
  <mgl-map
    [mapStyle]="mapStyle"
    [canvasContextAttributes]="{preserveDrawingBuffer: true}"
    [cooperativeGestures]="true"
    [cancelPendingTileRequestsWhileZooming]="true"
    [maxZoom]="20"
    [minZoom]="0"
    (mapLoad)="onMapLoad($event)"
  >

    <!--    <mgl-control-->
    <!--      class="map-zoom"-->
    <!--      mglNavigation-->
    <!--      [showCompass]="false"-->
    <!--    />-->
    @if (mapReady()) {
      <mgl-geojson-source id="grid" [data]="gridGeoJson()"></mgl-geojson-source>
      <mgl-layer
        id="grid-lines"
        source="grid"
        type="line"
        [paint]="gridLinePaint">
      </mgl-layer>
      <!-- Toscana background (behind comuni) -->
      <mgl-geojson-source
        id="toscana"
        [data]="mosaicToscana() ?? {type: 'FeatureCollection', features: []}">
      </mgl-geojson-source>

      <mgl-layer
        id="toscana-fill"
        source="toscana"
        type="fill"
        [paint]="toscanaFillPaint">
      </mgl-layer>

      <!-- Comuni mosaic source — promoteId='name' so all tiles of a municipality share hover state -->
      <mgl-geojson-source
        id="comuni"
        [data]="derivedPolygons()"
        [promoteId]="'name'">
      </mgl-geojson-source>

      <!-- Choropleth fill layer — colored by _rawValue, hover/select via feature-state -->
      <mgl-layer
        id="comuni-fill"
        source="comuni"
        type="fill"
        [paint]="comuniFillPaint()">
      </mgl-layer>

      <mgl-layer
        id="comuni-zero-line"
        source="comuni"
        type="line"
        [paint]="comuniZeroLinePaint()">
      </mgl-layer>

      <!-- Municipality name labels at centroid of each comune -->
      <mgl-geojson-source id="comuni-labels" [data]="comuniCentroids()"></mgl-geojson-source>

      <mgl-layer
        id="comuni-label-text"
        source="comuni-labels"
        type="symbol"
        [layout]="labelLayout"
        [paint]="labelPaint">
      </mgl-layer>

      <mgl-geojson-source id="interventi" [data]="interventiFeatures()"></mgl-geojson-source>

      <mgl-layer
        id="interventi-circles"
        source="interventi"
        type="symbol"
        [layout]="{
              'icon-image': 'interventi-square',
              'icon-size': ['interpolate', ['linear'], ['zoom'], 8, 0.4, 14, 0.8],
              'icon-allow-overlap': false,
              'icon-ignore-placement': true
            }"
        [paint]="interventiIconPaint()"
        (layerMouseEnter)="onInterventiEnter($event)"
        (layerMouseMove)="onInterventiEnter($event)">
      </mgl-layer>


    }
    <!-- Hover tooltip -->
    @if (hoveredIntervento()) {

      <mgl-popup
        [feature]="hoveredIntervento()"
        [closeButton]="false"
        [closeOnMove]="false"
        [closeOnClick]="true"
        class="full-width"
      >
        <sheldon-map-tooltip
          [intervento]="hoveredIntervento()?.properties ?? {}"
          [color]="tooltipPolygonColor()"
          [ellipsisLines]="12"
        />
      </mgl-popup>

    }
  </mgl-map>

  <!-- Choropleth legend -->
  <div class="map-legend">
    @for (shade of colorShades(); track shade; let i = $index) {
      <div class="legend-item">
        <span class="legend-label">{{ legendLabels[i] }}</span>
        <div
          class="legend-swatch"
          [class.legend-swatch--outline]="$first"
          [style.background]="$first ? '#ffffff' : shade"
          [style.border-color]="$first ? maxColorShade() : null">
        </div>
      </div>
    }
  </div>


  <!--      }-->
</div>
