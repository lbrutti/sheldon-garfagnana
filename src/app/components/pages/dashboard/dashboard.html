<sheldon-chart-v-bars
  groupBy="nomeComune"
  title="Popolazione per comune"
  filterBy="unione|anno"
  reduceBy="sum"
  [data]="popolazione()"
  [limit]="10"/>
<sheldon-chart-h-bars
  groupBy="nomeComune"
  title="Popolazione per comune (stacked bars)"
  filterBy="unione|anno"
  masterField="unione"
  reduceBy="sum"
  [data]="popolazione()"
  [limit]="10"/>


<sheldon-chart-line
  groupBy="anno"
  title="Andamento popolazione per comune"
  filterBy="unione|nomeComune|anno"
  masterField="unione"
  reduceBy="sum"
  [data]="popolazione()"
  [limit]="-1"/>


<sheldon-kpi
  groupBy="nomeComune"
  title="Popolazione totale dell'area"
  filterBy="unione|nomeComune|anno"
  masterField="unione"
  reduceBy="sum"
  [data]="popolazione()"
  [limit]="-1"/>
