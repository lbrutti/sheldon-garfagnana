<sheldon-global-search [interventi]="interventi()" (filter)="applyFilters($event)"/>

<mat-grid-list cols="2">

  <mat-grid-tile>
    <sheldon-kpi
      groupBy="nomeComune"
      title="Numero interventi per comune"
      reduceBy="count"
      [data]="progettiPerComune()"
      [limit]="-1"/>
  </mat-grid-tile>
</mat-grid-list>
