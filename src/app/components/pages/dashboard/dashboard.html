<sheldon-global-search [interventi]="interventi()" (filter)="applyFilters($event)"/>

<div class="grid">


  <!-- ISTOGRAMMI -->
  <sheldon-chart-bars
    #bar_end
    title="Interventi per anno di conclusione"
    groupBy="anno"
    reduceBy="count"
    filterBy="comune"
    sortBy="category"
    defaultSortDirection="asc"
    [showSorting]="false"
    [limit]="0"
    [data]="interventiPerFine()"
  ></sheldon-chart-bars>


  <sheldon-chart-bars
    #bar_start
    title="Interventi per anno di avvio"
    groupBy="anno"
    reduceBy="count"
    filterBy="comune"
    sortBy="category"
    defaultSortDirection="asc"
    [showSorting]="false"
    [limit]="0"
    [data]="interventiPerInizio()"
  ></sheldon-chart-bars>


  <sheldon-chart-h-bars
    #bar_comuni
    title="Numero interventi per comune"
    groupBy="comune"
    [filterBy]="null"
    [auxReduce]="[{campo:'comune', reduceBy:'count'} , {campo:'valore', reduceBy:'sum'}]"
    reduceBy="count"
    sortBy="value"
    defaultSortDirection="desc"
    [showSorting]="true"
    [limit]="10"
    [data]="interventiPerComune()"
  ></sheldon-chart-h-bars>

  <!-- KPIS -->

  <sheldon-kpi
    #kpi_comuni
    title="Comuni con almeno un intervento"
    groupBy="comune"
    reduceBy="count"
    [data]="comuniConInterventi()"
    [limit]="0"/>

  <sheldon-kpi
    #kpi_importo
    title="Importo finanziato"
    filterBy="comune"
    groupBy="valore"
    reduceBy="sum"
    udm="  €"
    [data]="interventiPerComune()"
    [limit]="0"/>
  <sheldon-kpi
    #kpi_interventi
    title="Interventi programmati"
    filterBy="comune"
    groupBy="comune"
    reduceBy="count"
    [data]="interventiPerComune()"
    [limit]="0"/>

  <!--  TABELLA -->
  <sheldon-list
    title="Interventi programmati"
    filterBy="comune"

    [data]="interventiPerComune()"></sheldon-list>

</div>
<!--  STACKS -->
<sheldon-segmented-chart
  title="Interventi per fonte di finanziamento"
  filterBy="comune"
  groupBy="valore"
  reduceBy="count"
  [data]="interventiPerFonte()"></sheldon-segmented-chart>
