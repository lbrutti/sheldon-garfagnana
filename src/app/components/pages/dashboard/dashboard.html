<sheldon-global-search [interventi]="interventi()" (filter)="applyFilters($event)"/>

<div class="grid">

  <!-- ISTOGRAMMI -->
  <sheldon-chart-bars
    title="Interventi per anno di conclusione"
    groupBy="anno"
    reduceBy="count"
    filterBy="comune" masterField="comune"
    sortBy="category"
    defaultSortDirection="asc"
    [showSorting]="false"
    [limit]="0"
    [data]="interventiPerFine()"
  ></sheldon-chart-bars>


  <sheldon-chart-bars
    title="Interventi per anno di avvio"
    groupBy="anno"
    reduceBy="count"
    filterBy="comune" masterField="comune"
    sortBy="category"
    defaultSortDirection="asc"
    [showSorting]="false"
    [limit]="0"
    [data]="interventiPerInizio()"
  ></sheldon-chart-bars>


  <sheldon-chart-h-bars
    title="Numero interventi per comune"
    groupBy="comune"
    [filterBy]="null"
    [auxReduce]="[{campo:'comune', reduceBy:'count'} , {campo:'valore', reduceBy:'sum'}]"
    reduceBy="count"
    sortBy="value"
    defaultSortDirection="desc"
    [showSorting]="true"
    [limit]="10"
    [data]="interventiPerComune()"
  ></sheldon-chart-h-bars>
  <!-- KPIS -->

  <sheldon-kpi
    title="Comuni con almeno un intervento"
    groupBy="comune"
    reduceBy="count"
    [data]="comuniConInterventi()"
    [limit]="0"/>

  <sheldon-kpi
    title="Importo finanziato"
    filterBy="comune" masterField="comune"
    groupBy="valore"
    reduceBy="sum"
    udm="  €"
    [data]="interventiPerComune()"
    [limit]="0"/>
  <sheldon-kpi
    title="Interventi programmati"
    filterBy="comune" masterField="comune"
    groupBy="comune"
    reduceBy="count"
    [data]="interventiPerComune()"
    [limit]="0"/>

  <!--  TABELLA -->
  <sheldon-list
    title="Interventi programmati"
    filterBy="comune" masterField="comune"

    [data]="interventiPerComune()"></sheldon-list>

</div>
<!--  STACKS -->
<sheldon-segmented-chart
  title="Interventi per fonte di finanziamento"
  filterBy="comune" masterField="comune"
  defaultSortDirection="asc"
  groupBy="valore"
  reduceBy="count"
  [data]="interventiPerFonte()"></sheldon-segmented-chart>

<sheldon-segmented-chart
  title="Interventi con coinvolgimento dei cittadini"
  defaultSortDirection="asc"
  groupBy="valore"
  reduceBy="count"
  [data]="interventiPerPartecipazione()"></sheldon-segmented-chart>

<sheldon-segmented-chart
  title="Stato di avanzamento degli interventi"
  defaultSortDirection="asc"
  filterBy="comune" masterField="comune"
  [auxReduce]="[{campo:'nome', reduceBy:'count'} , {campo:'valore', reduceBy:'sum'}]"
  groupBy="nome"
  reduceBy="count"
  [data]="interventiPerStato()"></sheldon-segmented-chart>

<sheldon-segmented-chart
  title="Distribuzione degli interventi per Unione"
  defaultSortDirection="asc"
  groupBy="valore"
  reduceBy="count"
  [data]="interventiPerUnione()"></sheldon-segmented-chart>

<!-- TREE MAPS -->
<sheldon-chart-treemap
  title="Tipologia di intervento"
  filterBy="comune" masterField="comune"
  campo="valore"
  reduceBy="sum"
  [data]="interventiPerTipologia()"
  [groups]="['tipologia']"
  [auxReduce]="[{ campo: 'progetti', reduceBy: 'count' }]"
></sheldon-chart-treemap>
<sheldon-chart-treemap
  title="Categorie principali degli interventi"
  campo="valore"
  reduceBy="sum"
  filterBy="comune" masterField="comune"
  [data]="interventiPerCategoria()"
  [groups]="['categoria']"
  [auxReduce]="[{ campo: 'progetti', reduceBy: 'count' }]"
></sheldon-chart-treemap>
<sheldon-chart-treemap
  title="Destinatari principali degli interventi"
  campo="valore"
  reduceBy="sum"
  filterBy="comune"
  masterField="comune"
  [data]="interventiPerTarget()"
  [groups]="['target']"
  [auxReduce]="[{ campo: 'progetti', reduceBy: 'count' }]"
></sheldon-chart-treemap>
<sheldon-chart-treemap
  title="Ambiti di azione principali degli interventi"
  campo="valore"
  reduceBy="sum"
  filterBy="comune" masterField="comune"
  [data]="interventiPerTema()"
  [groups]="['tema']"
  [auxReduce]="[{ campo: 'progetti', reduceBy: 'count' }]"
></sheldon-chart-treemap>


<sheldon-mosaic-map
  [polygons]="comuniPolygons()"
  [auxReduce]="[{campo:'value', reduceBy:'sum'}]"
  municipalityKey="name"
></sheldon-mosaic-map>
