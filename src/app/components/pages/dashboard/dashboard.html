<sheldon-global-search [interventi]="interventi()" (filter)="applyFilters($event)"/>

<div class="grid">


  <!-- ISTOGRAMMI -->
  <sheldon-chart-v-bars
    #bar_end
    groupBy="anno"
    title="Interventi per anno di conclusione"
    reduceBy="count"
    filterBy="comune"
    sortBy="category"
    defaultSortDirection="asc"
    [showSorting]="false"
    [limit]="0"
    [data]="interventiPerFine()"
  ></sheldon-chart-v-bars>


  <sheldon-chart-v-bars
    #bar_start
    groupBy="anno"
    title="Interventi per anno di avvio"
    reduceBy="count"
    filterBy="comune"
    sortBy="category"
    defaultSortDirection="asc"
    [showSorting]="false"
    [limit]="0"
    [data]="interventiPerInizio()"
  ></sheldon-chart-v-bars>


  <sheldon-chart-h-bars
    #bar_comuni
    groupBy="comune"
    title="Numero interventi per comune"
    [filterBy]="null"
    reduceBy="count"
    sortBy="value"
    defaultSortDirection="desc"
    [showSorting]="true"
    [limit]="10"
    [data]="interventiPerComune()"
  ></sheldon-chart-h-bars>

  <!-- KPIS -->

  <sheldon-kpi
    #kpi_comuni
    groupBy="comune"
    title="Comuni con almeno un intervento"
    reduceBy="count"
    [data]="comuniConInterventi()"
    [limit]="0"/>

  <sheldon-kpi
    #kpi_importo
    filterBy="comune"
    groupBy="valore"
    title="Importo finanziato"
    reduceBy="sum"
    udm="  €"
    [data]="interventiPerComune()"
    [limit]="0"/>
  <sheldon-kpi
    #kpi_interventi
    filterBy="comune"
    groupBy="comune"
    title="Interventi programmati"
    reduceBy="count"
    [data]="interventiPerComune()"
    [limit]="0"/>
</div>
