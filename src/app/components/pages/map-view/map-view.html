@if (!popupDismissed()) {
  <sheldon-popup
    [title]="'luoghi.popup.title' | transloco"
    [paragraphs]="['luoghi.popup.p1' | transloco, 'luoghi.popup.p2' | transloco, 'luoghi.popup.p3' | transloco, 'luoghi.popup.p4' | transloco]"
    [visible]="popupVisible()"
    (prosegui)="onPopupProsegui()"
  />
}

@if (settings()[0]; as setting) {
  @if ($any(dataMap()[setting.data])) {
    <sheldon-interventi-map
      [title]="setting.title"
      [infoText]="setting.info ?? ''"
      [cardId]="setting.id"
      [data]="$any(dataMap()[setting.data])"
      [auxReduce]="$any(setting.auxReduce ?? [])"
      [municipalityKey]="setting.municipalityKey ?? 'name'"
      [tooltipProperties]="setting.tooltipProperties"
      [categoria]="categoriaCorrente() || getCategoriaRandom(0)"
      [interventi]="interventiFiltrati()"
    >
      <sheldon-global-search
        mapControls [interventi]="interventi()"
        [unioniNascoste]="apiService.unioniNascoste()"
        (filter)="applyFilters($event)"/>
    </sheldon-interventi-map>
  }
}
