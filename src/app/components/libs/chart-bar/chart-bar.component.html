<sheldon-card class="height-sm"
              [categoria]="categoria()"
              [infoText]="infoText()"
              [cardId]="cardId()">
  <ng-container title>{{ title() || ('chart.projectsByComune' | transloco) }}</ng-container>
  <ng-container subheader>

    @if (showSorting()) {
      <sheldon-sort-toggle
        [defaultSortDirection]="defaultSortDirection()"
        (sortChange)="onSortChange($event)"
      />
    }
    @if (filterBy() !== null) {
      <sheldon-dynamic-filter
        [filterBy]="filtersFields()"
        [dataset]="data()"
        [masterField]="masterField()"
        (filterChange)="onFilterChange($event)"
      />
    }
    @if (auxReduce().length) {
      <sheldon-reduce-toggle [options]="this.auxReduce()" (reduceChange)="onReduceChange($event)"/>
    }
  </ng-container>
  <ng-container content>
    <div class="bars-container" #wrapper>
      @for (bar of bars(); track bar.label) {
        <div
          class="bar-col"
          [class.dimmed]="hoveredBar() !== null && hoveredBar() !== bar">
          <div
            class="bar"
            [style.height.%]="bar.pct"
            [style.background]="bar.background"
            (mouseenter)="onBarEnter(bar, $event)"
            (mousemove)="onBarMove($event)"
            (mouseleave)="onBarLeave()"
            (touchstart)="onBarTouch(bar, $event)">
            @if (hoveredBar() !== bar) {
              <sheldon-chart-label [text]="bar.label"/>
            }
          </div>
        </div>
      }
    </div>

    <sheldon-chart-tooltip
      [visible]="hoveredBar() !== null"
      [interactive]="touchMode()"
      [text]="hoveredBar()?.label ?? ''"
      [sub]="hoveredBar() ? (hoveredBar()!.value | multiples) : ''"
      [x]="pointer().x"
      [y]="pointer().y"
      [offsetX]="0"
      [offsetY]="0"
      (click)="onTooltipClick()"/>
  </ng-container>
</sheldon-card>
