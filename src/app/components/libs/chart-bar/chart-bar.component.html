<sheldon-card style="height: 183px"
              [categoria]="categoria()"
              [infoText]="infoText()"
              [cardId]="cardId()">
  <ng-container title>{{ title() || ('chart.projectsByComune' | transloco) }}</ng-container>
  <ng-container subheader>

    @if (showSorting()) {
      <sheldon-sort-toggle
        [defaultSortDirection]="defaultSortDirection()"
        (sortChange)="onSortChange($event)"
      />
    }
    @if (filterBy() !== null) {
      <sheldon-dynamic-filter
        [filterBy]="filtersFields()"
        [dataset]="data()"
        [masterField]="masterField()"
        (filterChange)="onFilterChange($event)"
      />
    }
    @if (auxReduce().length) {
      <sheldon-reduce-toggle [options]="this.auxReduce()" (reduceChange)="onReduceChange($event)"/>
    }
  </ng-container>
  <ng-container content>
    <div class="bars-container">
      @for (bar of bars(); track bar.label) {
        <div class="bar-col">
          <!--          <span class="bar-value">{{ bar.value }}</span>-->
          <div class="bar" [style.height.%]="bar.pct" [style.background]="bar.background">
            <sheldon-chart-label [text]="bar.label"/>
          </div>
        </div>
      }
    </div>
  </ng-container>
</sheldon-card>
