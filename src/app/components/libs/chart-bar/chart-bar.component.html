<sheldon-tile>
  <ng-container title>{{ title() }}</ng-container>
  <ng-container content>
    @if (showSorting()) {
      <sheldon-sort-toggle
        [defaultSortDirection]="defaultSortDirection()"
        (sortChange)="onSortChange($event)"
      />
    }
    @if (filterBy() !== null) {
      <sheldon-dynamic-filter
        [filterBy]="filtersFields()"
        [dataset]="data()"
        [masterField]="masterField()"
        (filterChange)="onFilterChange($event)"
      />
    }
    @if (auxReduce().length) {
      <mat-button-toggle-group
        [value]="{campo: groupBy(), reduceBy: reduceBy()}"
        (change)="onReduceChange($event)">
        <mat-button-toggle [value]="{campo: groupBy(), reduceBy: reduceBy()}">
          {{ groupBy() }}
        </mat-button-toggle>
        @for (aux of auxReduce(); track aux) {
          <mat-button-toggle [value]="aux">{{ aux.campo }}</mat-button-toggle>
        }
      </mat-button-toggle-group>
    }
    <div class="bars-container">
      @for (bar of bars(); track bar.label) {
        <div class="bar-col">
          <span class="bar-value">{{ bar.value }}</span>
          <div class="bar" [style.height.%]="bar.pct">
            <span class="bar-label">{{ bar.label }}</span>
          </div>
        </div>
      }
    </div>
  </ng-container>
</sheldon-tile>
