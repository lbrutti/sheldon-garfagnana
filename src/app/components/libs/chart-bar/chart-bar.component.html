<sheldon-card>
  <ng-container title>{{ this.title() }}</ng-container>
  <ng-container content>
    <!--    SORTING -->
    @if (this.showSorting()) {
      <sheldon-sort-toggle
        [defaultSortDirection]="this.defaultSortDirection()"
        (sortChange)="onSortChange($event)"></sheldon-sort-toggle>
    }

    <!--    FILTERING -->
    @if (this.filterBy() !== null) {
      <sheldon-dynamic-filter
        [filterBy]="this.filtersFields()"
        [dataset]="this.data()"
        [masterField]="this.masterField()"
        (filterChange)="onFilterChange($event)"/>
    }
    <!--    AUX REDUCE SWITCHES-->
    @if (this.auxReduce().length) {
      <mat-button-toggle-group
        [value]="{campo:this.groupBy(), reduceBy:this.reduceBy()}"
        (change)="onReduceChange($event)">
        <mat-button-toggle [value]="{campo:this.groupBy(), reduceBy:this.reduceBy()}">
          <!--          placeholder, trovare icona-->
          <span>{{ this.groupBy() }}</span>
        </mat-button-toggle>
        @for (aux of this.auxReduce(); track aux) {
          <mat-button-toggle [value]="aux">
            <span>{{ aux.campo }}</span>
          </mat-button-toggle>
        }
      </mat-button-toggle-group>
    }
    <!--    CHART -->
    <canvas
      baseChart
      [data]="chartData()"
      [options]="barChartOptions()"
      [type]="barChartType"
      (chartHover)="chartHovered($event)"
      (chartClick)="chartClicked($event)">
    </canvas>
  </ng-container>
</sheldon-card>
