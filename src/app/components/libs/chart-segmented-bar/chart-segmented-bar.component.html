<sheldon-card class="height-sm"
              [categoria]="categoria()"
              [infoText]="infoText()"
              [cardId]="cardId()">
  <ng-container title>{{ this.title() || ('chart.population' | transloco) }}</ng-container>
  <ng-container subheader>
    @if (showSorting()) {
      <!--    SORTING -->
      <sheldon-sort-toggle
        [defaultSortDirection]="this.defaultSortDirection()"
        (sortChange)="onSortChange($event)"></sheldon-sort-toggle>
    }
    @if (filterBy() !== null) {
      <!--    FILTERING -->
      <sheldon-dynamic-filter
        [filterBy]="this.filtersFields()"
        [dataset]="this.data()"
        [masterField]="this.masterField()"
        [fieldAliases]="filterFieldAliases()"
        (filterChange)="onFilterChange($event)"/>
    }
    <!--    AUX REDUCE SWITCHES-->
    @if (this.auxReduce().length) {
      <sheldon-reduce-toggle [options]="this.auxReduce()" (reduceChange)="onReduceChange($event)"/>
    }
  </ng-container>
  <ng-container content>
    <!-- ── CUSTOM SEGMENTED BAR ───────────────────────── -->
    <div class="pop-bar-container" #wrapper>
      <div
        class="pop-bar"
        role="img"
        [attr.aria-label]="'segmentedBar.populationDistribution' | transloco: { title: title() }"
      >
        @for (seg of segments(); track seg.label; let i = $index) {
          <div
            class="pop-segment"
            [class.pop-segment--hovered]="expandOnHover() && hoveredSegment() === seg"
            [class.pop-segment--dimmed]="hoveredSegment() !== null && hoveredSegment() !== seg"
            [style.flex]="expandOnHover() && hoveredSegment() === seg ? seg.percentage * 3 : seg.percentage"
            [style.min-width]="expandOnHover() && hoveredSegment() === seg ? 'max-content' : null"
            [style.background]="seg.color"
            (mouseenter)="onSegmentEnter(seg, $event)"
            (mousemove)="onSegmentMove($event)"
            (mouseleave)="onSegmentLeave()"
            (touchstart)="onSegmentTouch(seg, $event)"
            [attr.aria-label]="seg.label + ': ' + formatPercentage(seg)"
          >
            @if (hoveredSegment() !== seg) {
              <div class="pop-segment__content" [style.color]="seg.textColor">
                <sheldon-two-lines-chart-label
                  class="pop-segment__label"
                  text="{{ seg.shortLabel }}"
                  sub="{{ formatPercentage(seg) }}"
                />
              </div>
            }
          </div>
        }
      </div>
    </div>

    <sheldon-chart-tooltip
      [visible]="hoveredSegment() !== null"
      [interactive]="touchMode()"
      [text]="hoveredSegment()?.label ?? ''"
      [sub]="hoveredSegment() ? formatPercentage(hoveredSegment()!) : ''"
      [x]="pointer().x"
      [y]="pointer().y"
      [offsetX]="0"
      [offsetY]="0"
      (click)="onTooltipClick()"/>
  </ng-container>
</sheldon-card>
