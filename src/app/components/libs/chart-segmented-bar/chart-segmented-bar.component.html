<sheldon-card>
  <ng-container title>{{ this.title() }}</ng-container>
  <ng-container subheader>
    @if (showSorting()) {
      <!--    SORTING -->
      <sheldon-sort-toggle
        [defaultSortDirection]="this.defaultSortDirection()"
        (sortChange)="onSortChange($event)"></sheldon-sort-toggle>
    }
    @if (filterBy() !== null) {
      <!--    FILTERING -->
      <sheldon-dynamic-filter
        [filterBy]="this.filtersFields()"
        [dataset]="this.data()"
        [masterField]="this.masterField()"
        (filterChange)="onFilterChange($event)"/>
    }
    <!--    AUX REDUCE SWITCHES-->
    @if (this.auxReduce().length) {
      <sheldon-reduce-toggle [options]="this.auxReduce()" (reduceChange)="onReduceChange($event)"/>
    }
  </ng-container>
  <ng-container content>
    <!-- ── CUSTOM SEGMENTED BAR ───────────────────────── -->
    <div class="pop-bar-container">
      <div
        class="pop-bar"
        role="img"
        [attr.aria-label]="'Distribuzione popolazione: ' + title()"
      >
        @for (seg of segments(); track seg.label; let i = $index) {
          <div
            class="pop-segment"
            [class.pop-segment--hovered]="hoveredIndex() === i"
            [class.pop-segment--dimmed]="hoveredIndex() !== null && hoveredIndex() !== i"
            [style.flex]="hoveredIndex() === i ? seg.percentage * 3 : seg.percentage"
            [style.min-width]="hoveredIndex() === i ? 'max-content' : null"
            [style.background]="seg.color"
            (mouseenter)="onSegmentHover(i)"
            (mouseleave)="onSegmentLeave()"
            [attr.aria-label]="seg.label + ': ' + formatPercentage(seg.percentage)"
          >
            <div class="pop-segment__content" [style.color]="seg.textColor">
              <sheldon-two-lines-chart-label
                class="pop-segment__label"
                text="{{ hoveredIndex() === i ? seg.label : seg.shortLabel }}"
                sub="{{ formatPercentage(seg.percentage) }}"
              />
            </div>
          </div>
        }
      </div>
    </div>

  </ng-container>
</sheldon-card>
