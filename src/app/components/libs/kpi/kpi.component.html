<!-- sheldon-kpi-card.component.html -->
<sheldon-card>
  <ng-container title>{{ this.title() }}</ng-container>
  <ng-container content>
    <sheldon-dynamic-filter
      [filterBy]="this.filtersFields()"
      [dataset]="this.data()"
      [masterField]="this.masterField()"
      (filterChange)="onFilterChange($event)"/>

    <div class="kpi-value-wrapper">
      <h1
        class="kpi-value"
        [style.--from]="animFrom()"
        [style.--to]="animTo()"
      >
        <span class="kpi-counter" #counter></span>
      </h1>
    </div>
    <!--    <div>{{ this.animKey() }}</div>-->
    <!--    <div>{{ this.animFrom() }}</div>-->
    <!--    <div>{{ this.animTo() }}</div>-->
  </ng-container>
</sheldon-card>
