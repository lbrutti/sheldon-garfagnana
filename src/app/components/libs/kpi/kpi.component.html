<sheldon-card style="height: 183px"
              [categoria]="categoria()"
              [infoText]="infoText()">
  <ng-container title>{{ title() }}</ng-container>
  <ng-container subheader>
    <div class="sheldon-kpi-filter">
      <sheldon-dynamic-filter
        [filterBy]="filtersFields()"
        [dataset]="data()"
        [masterField]="masterField()"
        (filterChange)="onFilterChange($event)"/>
    </div>
  </ng-container>
  <ng-container content>
    <div class="sheldon-kpi-content" style="height: 55px">
      <div class="kpi-value-wrapper" sheldonFitText [minFontSize]="minFontSize()">
        <span #counter></span> <span>{{ udm() }}</span>
      </div>
    </div>
  </ng-container>
</sheldon-card>
