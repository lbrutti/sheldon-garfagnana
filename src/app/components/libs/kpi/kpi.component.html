<sheldon-card class="height-sm"
              [categoria]="categoria()"
              [infoText]="infoText()"
              [cardId]="cardId()">
  <ng-container title>{{ title() || ('chart.projectsByComune' | transloco) }}</ng-container>
  <ng-container subheader>
    <div class="sheldon-kpi-filter">
      <sheldon-dynamic-filter
        [filterBy]="filtersFields()"
        [dataset]="data()"
        [masterField]="masterField()"
        (filterChange)="onFilterChange($event)"/>
    </div>
  </ng-container>
  <ng-container content>
    <div class="kpi-value-wrapper" [style.font-size.px]="minFontSize()" #counter>
<!--      <span #counter></span>-->
    </div>
    <!--    <div class="sheldon-kpi-content">-->
    <!--    </div>-->
  </ng-container>
</sheldon-card>
