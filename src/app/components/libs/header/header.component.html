<header class="sheldon-header">
  <div class="panel panel--brand">
    <span class="label">PAESAGGI FUTURI</span>
  </div>

  <a class="panel panel--nav" href="https://unmotivoinpiu.com/" target="_blank">
    <span class="label">I PROGETTI</span>
  </a>

  <a class="panel panel--nav panel--active" routerLink="/dashboard">
    <span class="label">I DATI</span>
  </a>

  <button
    class="hamburger"
    [class.is-open]="menuOpen()"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen()"
    aria-label="Toggle menu"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

@if (menuOpen()) {
  <div class="toast-backdrop" (click)="closeMenu()"></div>
  <nav class="toast-menu">
    <a class="toast-menu__item" href="https://unmotivoinpiu.com/" target="_blank" (click)="closeMenu()">
      <span class="label">I PROGETTI</span>
    </a>
    <a class="toast-menu__item panel--active" routerLink="/dashboard" (click)="closeMenu()">
      <span class="label">I DATI</span>
    </a>
  </nav>
}
