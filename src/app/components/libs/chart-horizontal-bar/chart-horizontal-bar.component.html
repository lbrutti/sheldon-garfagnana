<sheldon-card class="height-l"
              [categoria]="categoria()"
              [infoText]="infoText()"
              [cardId]="cardId()">
  <ng-container title>
    {{ title() || ('chart.projectsByComune' | transloco) }}
  </ng-container>

  <ng-container subheader>
    @if (showSorting()) {
      <sheldon-sort-toggle
        [defaultSortDirection]="defaultSortDirection()"
        (sortChange)="onSortChange($event)"
      />
    }
    @if (filterBy() !== null) {
      <sheldon-dynamic-filter
        [filterBy]="filtersFields()"
        [dataset]="data()"
        [masterField]="masterField()"
        (filterChange)="onFilterChange($event)"
      />
    }
    @if (auxReduce().length) {
      <sheldon-reduce-toggle [options]="this.auxReduce()" (reduceChange)="onReduceChange($event)"/>
    }
  </ng-container>

  <ng-container content>
    <div class="h-bars-container" #wrapper [style.--zero-pct]="zeroLinePct() + '%'">
      @for (bar of bars(); track bar.label) {
        <div class="h-bar-container"
             [class.dimmed]="hoveredBar() !== null && hoveredBar() !== bar"
        >
          @if (hoveredBar() !== bar) {
            <sheldon-chart-label
              text="{{bar.label}}"
              sub="{{(bar.value|multiples) + udm()}}"/>
          }
          <div class="h-bar"
               [class.negative]="bar.negative"
               [style.width.%]="bar.pct"
               [style.--bar-pct]="bar.pct + '%'"
               [style.min-height]="'var(--min-bar-height, 96px)'"
               [style.background]="bar.background"
               (mouseenter)="onBarEnter(bar, $event)"
               (mousemove)="onBarMove($event)"
               (mouseleave)="onBarLeave()"
               (touchstart)="onBarTouch(bar, $event)">
          </div>
        </div>
      }
      @if (zeroLinePct() > 0) {
        <div class="zero-line"></div>
      }
    </div>

    <sheldon-chart-tooltip
      [visible]="hoveredBar() !== null"
      [interactive]="touchMode()"
      [text]="hoveredBar()?.label ?? ''"
      [sub]="hoveredBar() ? (hoveredBar()!.value | multiples)+udm() : ''"
      [x]="pointer().x"
      [y]="pointer().y"
      [offsetX]="0"
      [offsetY]="0"
      (click)="onTooltipClick()"/>
  </ng-container>
</sheldon-card>
