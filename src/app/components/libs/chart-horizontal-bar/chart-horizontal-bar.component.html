<sheldon-card 
              [categoria]="categoria()">
  <ng-container title>
    {{ title() }}
  </ng-container>

  <ng-container subheader>
    @if (showSorting()) {
      <sheldon-sort-toggle
        [defaultSortDirection]="defaultSortDirection()"
        (sortChange)="onSortChange($event)"
      />
    }
    @if (filterBy() !== null) {
      <sheldon-dynamic-filter
        [filterBy]="filtersFields()"
        [dataset]="data()"
        [masterField]="masterField()"
        (filterChange)="onFilterChange($event)"
      />
    }
    @if (auxReduce().length) {
      <sheldon-reduce-toggle [options]="this.auxReduce()" (reduceChange)="onReduceChange($event)"/>
    }
  </ng-container>

  <ng-container content>
    @for (bar of bars(); track bar) {
      <div class="h-bar-container">
        <sheldon-chart-label
          text="{{bar.label}}"
          sub="{{bar.value|multiples}}"/>
        <div class="h-bar"
             [style.width.%]="bar.pct"
             [style.min-height]="'var(--min-bar-height, 96px)'"
             [style.background]="bar.background">
        </div>
      </div>
    }

  </ng-container>
</sheldon-card>
