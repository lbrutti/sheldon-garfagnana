<sheldon-card>
  <ng-container title>
    {{ title() }}
  </ng-container>

  <ng-container subheader>
    @if (showSorting()) {
      <sheldon-sort-toggle
        [defaultSortDirection]="defaultSortDirection()"
        (sortChange)="onSortChange($event)"
      />
    }
    @if (filterBy() !== null) {
      <sheldon-dynamic-filter
        [filterBy]="filtersFields()"
        [dataset]="data()"
        [masterField]="masterField()"
        (filterChange)="onFilterChange($event)"
      />
    }
    @if (auxReduce().length) {
      <mat-button-toggle-group
        [value]="auxReduce()[0]"
        [hideSingleSelectionIndicator]="true"
        [hideMultipleSelectionIndicator]="true"
        (change)="onReduceChange($event)">
        @for (aux of auxReduce(); track aux) {
          <mat-button-toggle [value]="aux">{{ aux.campo }}</mat-button-toggle>
        }
      </mat-button-toggle-group>
    }
  </ng-container>

  <ng-container content>
    @for (bar of bars(); track bars) {
      <div class="h-bar-container">
        <sheldon-chart-label
          text="{{bar.label}}"
          sub="{{bar.value|multiples}}"/>

        <div class="h-bar"
             [style.width.%]="bar.pct"
             [style.min-height]="'var(--min-bar-height, 96px)'"
             [style.background]="bar.background">
        </div>
      </div>
    }

  </ng-container>
</sheldon-card>
