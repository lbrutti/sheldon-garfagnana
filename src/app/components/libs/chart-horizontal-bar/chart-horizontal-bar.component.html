<sheldon-card>
  <ng-container title>{{ title() }}</ng-container>
  <ng-container content>
    @if (showSorting()) {
      <sheldon-sort-toggle
        [defaultSortDirection]="defaultSortDirection()"
        (sortChange)="onSortChange($event)"
      />
    }
    @if (filterBy() !== null) {
      <sheldon-dynamic-filter
        [filterBy]="filtersFields()"
        [dataset]="data()"
        [masterField]="masterField()"
        (filterChange)="onFilterChange($event)"
      />
    }
    @if (auxReduce().length) {
      <mat-button-toggle-group [value]="auxReduce()[0]" (change)="onReduceChange($event)">
        @for (aux of auxReduce(); track aux) {
          <mat-button-toggle [value]="aux">{{ aux.campo }}</mat-button-toggle>
        }
      </mat-button-toggle-group>
    }
    <div class="h-bars-container">
      @for (bar of bars(); track bar.label) {
        <div class="h-bar" [style.width.%]="bar.pct" [style.min-height]="'var(--min-bar-height, 96px)'">
          <div class="h-bar-caption">
            <span class="h-bar-label">{{ bar.label }}</span>
            <span class="h-bar-value">{{ bar.value }}</span>
          </div>
        </div>
      }
    </div>
  </ng-container>
</sheldon-card>
