<nav mat-tab-nav-bar [tabPanel]="tabPanel" [style.background]="background()">
  @for (link of links; track link) {
    <a mat-tab-link
       [routerLink]="link.url"
       [active]="activeLink() === link.url"> {{ link.name }} </a>
  }
</nav>
<mat-tab-nav-panel #tabPanel>
  <router-outlet/>
</mat-tab-nav-panel>
