<form class="example-form">
  <mat-form-field>
    <mat-label>Input</mat-label>
    <input matInput
           [matAutocomplete]="auto"
           [formControl]="textBox"
           (input)="applyFilter($event)"
           (focus)="applyFilter($event)">
    <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn">
      @for (option of filteredSuggestions(); track option) {
        <mat-option [value]="option">{{ option.value }}</mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>
  <mat-button-toggle-group
    [formControl]="chipSet"
    name="ingredients"
    aria-label="Ingredients"
    multiple>
    @for (option of chips(); track option) {
      <mat-button-toggle
        [value]="option"
        (change)="(applyFilter($event))">{{ option.value }}
      </mat-button-toggle>
    }
  </mat-button-toggle-group>
</form>
