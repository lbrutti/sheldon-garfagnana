<div class="search-container">
  <sheldon-theme-switch [categoria]="selectedCategoria"/>
  <form class="search-form">
    <mat-select
      id="select-unione"
      [formControl]="selectUnione"
      [value]="{value: '',key: 'unione'}"
      [placeholder]="'globalSearch.searchByUnione' | transloco"
      panelClass="global-search-select-panel"
      (selectionChange)="(applyFilter())"
    >
      @for (option of suggestions(); track option) {
        <mat-option [value]="option">{{ option.label }}</mat-option>
      }
    </mat-select>

    <mat-select
      id="select-categoria"
      [formControl]="selectCategoria"
      [attr.data-categoria]="selectedCategoria"
      [placeholder]="'globalSearch.category' | transloco"
      panelClass="global-search-select-panel"
      (selectionChange)="(handleCategoriaSelect())"
    >
      <mat-option value="">{{ 'globalSearch.allCategories' | transloco }}</mat-option>
      @for (option of chips(); track option) {
        <mat-option
          [attr.data-categoria]="normalizzaStringa(option.value)"
          [value]="option">{{ option.label }}
        </mat-option>
      }
    </mat-select>
    <mat-button-toggle-group
      [formControl]="chipSet"
      [hideSingleSelectionIndicator]="true"
      [hideMultipleSelectionIndicator]="true"
      multiple
    >
      @for (option of chips(); track option) {
        <mat-button-toggle
          [attr.data-categoria]="normalizzaStringa(option.value)"
          [value]="option"
          (change)="(handleToggle($event))">{{ option.value }}
        </mat-button-toggle>
      }
    </mat-button-toggle-group>
  </form>
</div>
