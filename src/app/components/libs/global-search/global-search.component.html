<form class="example-form">
  <mat-form-field appearance="outline">
    <mat-select
      [formControl]="selectUnione"
      value="all"
      (selectionChange)="(applyFilter())"
    >
      <mat-option value="all">Tutte le unioni</mat-option>
      @for (option of suggestions(); track option) {
        <mat-option [value]="option">{{ option.value }}</mat-option>
      }
    </mat-select>

  </mat-form-field>
  <mat-button-toggle-group
    [formControl]="chipSet"
    name="ingredients"
    aria-label="Ingredients"
    multiple>
    @for (option of chips(); track option) {
      <mat-button-toggle
        [value]="option"
        (change)="(applyFilter())">{{ option.value }}
      </mat-button-toggle>
    }
  </mat-button-toggle-group>
</form>
