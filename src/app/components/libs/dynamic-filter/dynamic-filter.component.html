<form [formGroup]="filterForm" class="filter-form">
  @for (field of fields(); track field) {

    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>{{ field | titlecase }}</mat-label>

      <input
        matInput
        [id]="field"
        [formControlName]="field"
        [placeholder]="'Filter by ' + field"
        [matAutocomplete]="optionsFor(field).length ? auto : nullAuto"
      />

      <!-- Autocomplete panel — shown only when options are provided -->
      <mat-autocomplete #auto="matAutocomplete">
        @for (opt of filteredOptions(field); track opt.key) {
          <mat-option [value]="opt.key">{{ opt.value }}</mat-option>
        }
      </mat-autocomplete>

      <!-- Empty autocomplete reference used for fields with no options -->
      <mat-autocomplete #nullAuto="matAutocomplete" />

    </mat-form-field>
  }
</form>
