<form [formGroup]="filterForm" class="filter-form">
  @for (field of fields(); track field) {

    <mat-form-field appearance="outline" class="filter-field">

      <input
        matInput
        #inputEl
        [id]="field"
        [formControlName]="field"
        [placeholder]="'filter.search' | transloco: { field: (fieldAliases()[field] ?? field) }"
        [matAutocomplete]="auto"
        #trigger="matAutocompleteTrigger"
      />

      @if (hasValue(field)) {
        <button matSuffix mat-icon-button (click)="clearField(field, trigger, inputEl)" type="button"
                [attr.aria-label]="'filter.clear' | transloco">
          <mat-icon>close</mat-icon>
        </button>
      }

      <mat-autocomplete #auto="matAutocomplete"
                        class="dynamic-filter-autocomplete-panel">
        @for (opt of filteredOptions(field); track opt.key) {
          <mat-option [value]="opt.value">{{ opt.value }}</mat-option>
        }
      </mat-autocomplete>

    </mat-form-field>
  }
</form>
