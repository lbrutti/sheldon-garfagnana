<sheldon-card
  [categoria]="categoria()"
  [infoText]="infoText()"
  [cardId]="cardId()">
  <ng-container title>{{ title() }}</ng-container>
  <ng-container subheader>
    <sheldon-dynamic-filter
      [filterBy]="filtersFields()"
      [dataset]="data()"
      [masterField]="masterField()"
      (filterChange)="onFilterChange($event)"/>
  </ng-container>
  <ng-container content>
    <mat-list>
      <!--      @for (dato of filteredData(); track dato) {-->
      <cdk-virtual-scroll-viewport appendOnly itemSize="30" class="list-container"
                                   [style.height.px]="(filteredData().length < 10 ?filteredData().length * 36 : 270)">

        <mat-list-item *cdkVirtualFor="let dato of filteredData()">
          <div class="list-row">
            <span class="nome-container">{{ dato.nome }}</span>
            <span class="valore-container">{{ dato.valore | multiples }}</span>
          </div>
        </mat-list-item>
        <mat-list-item>
          <div class="list-row">
            <span class="nome-container">Totale</span>
            <span class="valore-container">{{ totaleValore() | multiples }}</span>
          </div>
        </mat-list-item>
      </cdk-virtual-scroll-viewport>
      <!--      }-->
    </mat-list>
  </ng-container>
</sheldon-card>
