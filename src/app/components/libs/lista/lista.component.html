<sheldon-card>
  <ng-container title>{{ title() }}</ng-container>
  <ng-container subheader>
    <sheldon-dynamic-filter
      [filterBy]="filtersFields()"
      [dataset]="data()"
      [masterField]="masterField()"
      (filterChange)="onFilterChange($event)"/>
  </ng-container>
  <ng-container content>
    <mat-list>
      <!--      @for (dato of filteredData(); track dato) {-->
      <cdk-virtual-scroll-viewport appendOnly itemSize="30" class="list-container">

        <mat-list-item *cdkVirtualFor="let dato of filteredData()">
          <div [style]="{display:'flex', flexDirection:'row', justifyContent:'space-between'}">
          <span [style]="{display:'inline-block', textOverflow:'ellipsis', width:'80%'}">
            {{ dato.nome }}
          </span>
            <span [style]="{display:'inline-block'}">
            {{ dato.valore | multiples }}
          </span>
          </div>
        </mat-list-item>
        <mat-list-item>
          <div [style]="{display:'flex', flexDirection:'row', justifyContent:'space-between'}">
          <span [style]="{display:'inline-block'}">
            Totale
          </span>
            <span [style]="{display:'inline-block'}">
            {{ totaleValore()  | multiples }}
          </span>
          </div>
        </mat-list-item>
      </cdk-virtual-scroll-viewport>
      <!--      }-->
    </mat-list>
  </ng-container>
</sheldon-card>
