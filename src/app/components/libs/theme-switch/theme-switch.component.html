<mat-button-toggle-group
  [hideSingleSelectionIndicator]="true"
  [hideMultipleSelectionIndicator]="true"
  [attr.data-categoria]="categoriaCorrente()"
  [value]="theme()"
  (change)="onChange($event)">
  @for (opt of options; track opt.value) {
    <mat-button-toggle [value]="opt.value" [aria-label]="opt.value">
      <img [src]="opt.icon" [alt]="opt.value" class="theme-icon">
    </mat-button-toggle>
  }
</mat-button-toggle-group>
