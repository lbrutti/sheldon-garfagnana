<sheldon-card>
  <ng-container title>{{ this.title() }}</ng-container>
  <ng-container content>

    <!--  FILTERING -->
    @if (this.filterBy() !== null) {
      <sheldon-dynamic-filter
        [filterBy]="this.filtersFields()"
        [dataset]="this.data()"
        [masterField]="this.masterField()"
        (filterChange)="onFilterChange($event)"/>
    }

    <!--  AUX REDUCE SWITCHES -->
    @if (this.auxReduce().length) {
      <mat-button-toggle-group
        [value]="this.currentReduce()"
        (change)="onReduceChange($event)">
        <mat-button-toggle [value]="{campo: this.campo(), reduceBy: this.reduceBy()}">
          <span>{{ this.campo() }}</span>
        </mat-button-toggle>
        @for (aux of this.auxReduce(); track aux) {
          <mat-button-toggle [value]="aux">
            <span>{{ aux.campo }}</span>
          </mat-button-toggle>
        }
      </mat-button-toggle-group>
    }

    <!--  TREEMAP -->
    <div class="treemap-wrapper">
      @for (tile of tiles(); track tile.label) {
        <div
          class="treemap-tile"
          [style.left.%]="tile.x"
          [style.top.%]="tile.y"
          [style.width.%]="tile.w"
          [style.height.%]="tile.h"
          [style.background]="tile.color">
          <div class="treemap-tile__label">{{ tile.label }}</div>
          <div class="treemap-tile__value">{{ tile.formattedValue }}</div>
        </div>
      }
    </div>

  </ng-container>
</sheldon-card>
