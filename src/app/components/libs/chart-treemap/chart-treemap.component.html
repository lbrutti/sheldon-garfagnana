<sheldon-card>
  <ng-container title>{{ this.title() }}</ng-container>
  <ng-container subheader>

    <!--  FILTERING -->
    @if (this.filterBy() !== null) {
      <sheldon-dynamic-filter
        [filterBy]="this.filtersFields()"
        [dataset]="this.data()"
        [masterField]="this.masterField()"
        (filterChange)="onFilterChange($event)"/>
    }

    <!--  AUX REDUCE SWITCHES -->
    @if (this.auxReduce().length) {
      <mat-button-toggle-group
        [value]="this.auxReduce()[0]"
        [hideSingleSelectionIndicator]="true"
        [hideMultipleSelectionIndicator]="true"
        (change)="onReduceChange($event)">
        <!---->
        @for (aux of this.auxReduce(); track aux) {
          <mat-button-toggle [value]="aux">
            <span>{{ aux.campo }}</span>
          </mat-button-toggle>
        }
      </mat-button-toggle-group>
    }

  </ng-container>
  <ng-container content>

    <!--  TREEMAP -->
    <div class="treemap-wrapper">
      @for (tile of tiles(); track tile.label) {
        <div
          class="treemap-tile"
          [style.left.%]="tile.x"
          [style.top.%]="tile.y"
          [style.width.%]="tile.w"
          [style.height.%]="tile.h"
          [style.background]="tile.color">
          <sheldon-two-lines-chart-label
            [text]="tile.label"
            [sub]="tile.formattedValue"/>
        </div>
      }
    </div>

  </ng-container>
</sheldon-card>
