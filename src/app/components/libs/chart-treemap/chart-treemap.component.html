<sheldon-card
  class="height-l"
  [categoria]="categoria()"
  [infoText]="infoText()"
  [cardId]="cardId()">
  <ng-container title>{{ this.title() || ('chart.treemap' | transloco) }}</ng-container>
  <ng-container subheader>

    <!--  FILTERING -->
    @if (this.filterBy() !== null) {
      <sheldon-dynamic-filter
        [filterBy]="this.filtersFields()"
        [dataset]="this.data()"
        [masterField]="this.masterField()"
        [fieldAliases]="filterFieldAliases()"
        (filterChange)="onFilterChange($event)"/>
    }

    <!--  AUX REDUCE SWITCHES -->
    @if (this.auxReduce().length > 1) {
      <sheldon-reduce-toggle [options]="this.auxReduce()" (reduceChange)="onReduceChange($event)"/>
    }

  </ng-container>
  <ng-container content>

    <!--  TREEMAP -->
    <div class="treemap-wrapper" #wrapper>
      @for (tile of tiles(); track tile.label) {
        <div
          class="treemap-tile cursor-pointer"
          [class.dimmed]="hoveredTile() !== null && hoveredTile() !== tile"
          [style.left.%]="tile.x"
          [style.top.%]="tile.y"
          [style.width.%]="tile.w"
          [style.height.%]="tile.h"
          [style.background]="tile.color"
          (mouseenter)="onTileEnter(tile, $event)"
          (mousemove)="onTileMove($event)"
          (mouseleave)="onTileLeave()"
          (touchstart)="onTileTouch(tile, $event)">
          @if (hoveredTile() !== tile) {
            <sheldon-two-lines-chart-label
              [text]="tile.label"
              [sub]="tile.formattedValue"/>
          }
        </div>
      }
    </div>

    <!--  HOVER / TOUCH TOOLTIP -->
    <sheldon-chart-tooltip
      [visible]="hoveredTile() !== null"
      [interactive]="touchMode()"
      [text]="hoveredTile()?.label ?? ''"
      [sub]="hoveredTile()?.formattedValue ?? ''"
      [x]="pointer().x"
      [y]="pointer().y"
      [offsetX]="0"
      [offsetY]="0"
      (click)="onTooltipClick()"/>

  </ng-container>
</sheldon-card>
