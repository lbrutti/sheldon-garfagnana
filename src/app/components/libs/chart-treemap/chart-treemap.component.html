<sheldon-card style="height: 471px"
              [categoria]="categoria()"
              [infoText]="infoText()"
              [cardId]="cardId()">
  <ng-container title>{{ this.title() || ('chart.treemap' | transloco) }}</ng-container>
  <ng-container subheader>

    <!--  FILTERING -->
    @if (this.filterBy() !== null) {
      <sheldon-dynamic-filter
        [filterBy]="this.filtersFields()"
        [dataset]="this.data()"
        [masterField]="this.masterField()"
        (filterChange)="onFilterChange($event)"/>
    }

    <!--  AUX REDUCE SWITCHES -->
    @if (this.auxReduce().length) {
      <sheldon-reduce-toggle [options]="this.auxReduce()" (reduceChange)="onReduceChange($event)"/>
    }

  </ng-container>
  <ng-container content>

    <!--  TREEMAP -->
    <div class="treemap-wrapper">
      @for (tile of tiles(); track tile.label) {
        <div
          class="treemap-tile"
          [style.left.%]="tile.x"
          [style.top.%]="tile.y"
          [style.width.%]="tile.w"
          [style.height.%]="tile.h"
          [style.background]="tile.color">
          <sheldon-two-lines-chart-label
            [text]="tile.label"
            [sub]="tile.formattedValue"/>
        </div>
      }
    </div>

  </ng-container>
</sheldon-card>
