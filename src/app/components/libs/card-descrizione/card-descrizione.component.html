<sheldon-card
  class="height-m"
  [showButtons]="false">
  <ng-container title>{{ data()[title()] }}</ng-container>
  <ng-container content>
    <div class="sheldon-card-descrizione">
      {{ data()[description()] }}
    </div>
    @if (data()[url()]) {
      <div class="sheldon-card-descrizione-button">
        <a matButton="outlined" href="{{data()[url()]}}" target="_blank">{{ 'card.discoverMore' | transloco }}</a>
      </div>
    }
  </ng-container>
</sheldon-card>
