<sheldon-card
  class="height-m"
  [showSubheader]="false"
  [showButtons]="false">
  <ng-container title>{{ data()[title()] }}</ng-container>
  <ng-container content>
    <div class="sheldon-card-descrizione"
         [class.has-button]="data()[url()]">
      {{ data()[description()] }}
    </div>
    @if (data()[url()]) {
      <sheldon-link-button [data]="data()" [url]="url()"></sheldon-link-button>
    }
  </ng-container>
</sheldon-card>
