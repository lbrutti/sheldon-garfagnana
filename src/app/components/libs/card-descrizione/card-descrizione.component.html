<sheldon-card
  [showButtons]="false">
  <ng-container title>{{ data()[title()] }}</ng-container>
  <ng-container content>
    <div class="sheldon-card-descrizione">
      {{ data()[description()] }}
    </div>
    <div class="sheldon-card-descrizione-button">
      <a matButton="outlined" href="{{data()[url()]}}" target="_blank">Scopri di più</a>
    </div>
  </ng-container>
</sheldon-card>
