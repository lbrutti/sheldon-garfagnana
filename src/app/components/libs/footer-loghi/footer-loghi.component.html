<div class="footer-loghi" [attr.aria-label]="'footerLoghi.ariaLabel' | transloco">
  <div class="footer-loghi__partner">
    <img
      class="footer-loghi__logo"
      src="assets/img/loghi/1.jpg"
      alt="Area Interna Garfagnana, Lunigiana, Media Valle del Serchio, Appennino Pistoiese"
      loading="lazy"
      decoding="async"
    />
    <img
      class="footer-loghi__logo"
      src="assets/img/loghi/2.jpg"
      alt="Unione Comuni Garfagnana"
      loading="lazy"
      decoding="async"
    />
    <img
      class="footer-loghi__logo"
      src="assets/img/loghi/3.jpg"
      alt="Unione di Comuni Montana Lunigiana"
      loading="lazy"
      decoding="async"
    />
    <img
      class="footer-loghi__logo"
      src="assets/img/loghi/4.jpg"
      alt="Unione dei Comuni Media Valle del Serchio"
      loading="lazy"
      decoding="async"
    />
    <img
      class="footer-loghi__logo"
      src="assets/img/loghi/5.jpg"
      alt="Unione di Comuni Montani Appennino Pistoiese"
      loading="lazy"
      decoding="async"
    />
  </div>

  <div class="footer-loghi__istituzionali">
    <p class="footer-loghi__claim">{{ 'footerLoghi.claim' | transloco }}</p>
    <img
      src="assets/img/loghi/coesione_italia.jpg"
      alt="Coesione Italia 21-27 Toscana, Cofinanziato dall'Unione europea, Repubblica Italiana, Regione Toscana, Giovani Sì"
      loading="lazy"
      decoding="async"
    />
  </div>
</div>
