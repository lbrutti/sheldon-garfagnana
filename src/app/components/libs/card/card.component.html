<mat-card class="example-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>
      <ng-content select="[title]"></ng-content>
      <button matIconButton>
        <mat-icon aria-hidden="false" aria-label="info" fontIcon="info"></mat-icon>
      </button>
      <button matIconButton>
        <mat-icon aria-hidden="false" aria-label="download" fontIcon="arrow_downward"></mat-icon>
      </button>
<!--      <button matIconButton>-->
<!--        <mat-icon aria-hidden="false" aria-label="embed" fontIcon="code_xml"></mat-icon>-->
<!--      </button>-->
    </mat-card-title>
    <mat-card-subtitle>
      <ng-content select="[subtitle]"></ng-content>

    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <ng-content select="[content]"></ng-content>
  </mat-card-content>
<!--  <mat-card-actions>-->
<!--    <button matButton>LIKE</button>-->
<!--    <button matButton>SHARE</button>-->
<!--  </mat-card-actions>-->
</mat-card>
