@if (!popupDismissed()) {
  <sheldon-popup
    [title]="'storie.popup.title' | transloco"
    [paragraphs]="['storie.popup.p1' | transloco, 'storie.popup.p2' | transloco, 'storie.popup.p3' | transloco, 'storie.popup.p4' | transloco]"
    [visible]="popupVisible()"
    (prosegui)="onPopupProsegui()"
  />
}

<div class="header">
  <sheldon-theme-switch/>
</div>
<ngx-masonry
  class="sheldon-grid"
  [class.layout-ready]="layoutReady()"
  [options]="masonryOptions"
  (layoutComplete)="onLayoutComplete()">
  <div class="grid-sizer"></div>
  @for (story of stories(); track story.id; ) {
    <div ngxMasonryItem [class]="'tile tile--3'">
      <sheldon-story [data]="story"/>
    </div>
  }
</ngx-masonry>
